<!doctype html>
<!--
  OGP画像（1200x630）の元になるページ。
  scripts/ogp/build.py が Chrome で開いて切り出し、public/images/ogp.webp を作る。
  文言を変えたいときはこのファイルを直してから build.py を動かす。
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Yomogi&display=swap" />
<style>
  :root {
    --paper: #fbf7ee;
    --ink: #2d2a26;
    --pencil: rgba(45, 42, 38, 0.78);
    --marker: #ffe066;
    --accent: #e8590c;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  #card {
    position: relative;
    width: 1200px; height: 630px;
    background: var(--paper);
    overflow: hidden;
    font-family: "Klee One", serif;
    color: var(--ink);
  }

  /* 紙の目 */
  #card::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(45,42,38,.035) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(45,42,38,.03) 0 1px, transparent 1px);
    background-size: 7px 7px, 11px 11px;
  }
  /* 方眼（うっすら） */
  #card::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(45,42,38,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,42,38,.045) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
  }

  .frame {
    position: absolute; inset: 26px;
    border: 3px solid var(--ink);
    border-radius: 26px 10px 30px 12px / 12px 28px 10px 26px;
    filter: url(#rough);
    z-index: 1;
  }

  .inner {
    position: absolute; inset: 26px;
    z-index: 2;
    display: flex; align-items: center; gap: 56px;
    padding: 0 68px;
  }

  .avatar {
    flex: 0 0 auto;
    width: 248px; height: 248px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 7px 9px 0 var(--pencil);
    overflow: hidden;
  }
  .avatar img { width: 184px; height: 184px; object-fit: contain; }

  .name {
    font-family: "Yomogi", "Klee One", sans-serif;
    font-size: 108px; line-height: 1.05; letter-spacing: -.01em;
    position: relative; display: inline-block; padding: 0 6px;
  }
  /* 蛍光ペンで引いた線 */
  .name::after {
    content: ""; position: absolute; left: -6px; right: -10px; bottom: 10px; height: 26px;
    background: var(--marker); opacity: .85; z-index: -1;
    border-radius: 12px 4px 14px 5px / 6px 12px 4px 12px;
    transform: rotate(-.6deg);
  }

  .lead {
    margin-top: 26px;
    font-size: 32px; line-height: 1.5; font-weight: 600; max-width: 640px;
  }
  .sub {
    margin-top: 14px;
    font-size: 25px; line-height: 1.5;
    color: rgba(45,42,38,.72);
  }

  .tags { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tag {
    font-size: 21px; padding: 7px 18px;
    border: 2.5px solid var(--ink);
    border-radius: 16px 6px 18px 7px / 7px 17px 6px 16px;
    box-shadow: 3px 4px 0 var(--pencil);
    filter: url(#rough);
    background: #fff;
  }

  .url {
    position: absolute; right: 56px; bottom: 46px; z-index: 3;
    font-size: 22px; color: var(--accent); font-weight: 600;
    letter-spacing: .01em;
  }
  .corner {
    position: absolute; z-index: 3; width: 58px; height: 58px;
    border: 3px solid var(--accent); filter: url(#rough);
  }
  .corner.tl { left: 46px; top: 46px; border-right: 0; border-bottom: 0; }
  .corner.br { right: 46px; bottom: 46px; border-left: 0; border-top: 0; display: none; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="card">
    <div class="frame"></div>
    <div class="corner tl"></div>
    <div class="corner br"></div>
    <div class="inner">
      <div class="avatar"><img src="../../public/images/icon-light.webp" alt="" /></div>
      <div>
        <div class="name">Kopo-k</div>
        <p class="lead">愛知県の大学生で、プログラミングを学んでいます。</p>
        <p class="sub">ゲーム・モバイルアプリ・Webアプリを作っています。</p>
        <div class="tags">
          <span class="tag">Unity</span>
          <span class="tag">Swift</span>
          <span class="tag">React</span>
          <span class="tag">PHP</span>
        </div>
      </div>
    </div>
    <div class="url">kopo-k.github.io/my-portfolio</div>
  </div>
</body>
</html>
